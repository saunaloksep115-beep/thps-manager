<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>THPS Assessment – Marks Online</title>
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{--ink:#1d1d1f;--mut:#6b6b70;--line:#dcdce0;--bg:#f3f3f5;--card:#fff;--dark:#1f1f1f;--gold:#f5b700;--ok:#1a7f37;--warn:#b35c00;--bad:#c62828;--blue:#0b63c4}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif}
header{position:sticky;top:0;z-index:20;background:var(--dark);color:#fff;display:flex;align-items:center;gap:10px;padding:8px 14px;flex-wrap:wrap}
header .brand{flex:1;min-width:180px}
header .brand b{display:block;font-size:16px;letter-spacing:.2px}
header .brand small{color:#cfcfcf;font-size:12px}
.pill{display:inline-flex;align-items:center;gap:7px;border-radius:999px;padding:5px 11px;font-size:13px;font-weight:600;background:#333;color:#fff;cursor:pointer;border:0}
.pill i{width:9px;height:9px;border-radius:50%;background:#999;display:inline-block}
.pill.ok i{background:#3ddc84}.pill.wait i{background:var(--gold)}.pill.off i{background:#ff6b6b}.pill.busy i{background:#64b5ff}
.hbtn{background:transparent;color:#fff;border:1px solid #555;border-radius:8px;padding:5px 10px;font:inherit;font-size:13px;cursor:pointer}
main{max-width:1200px;margin:0 auto;padding:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
h1{font-size:21px;margin:0 0 4px}h2{font-size:17px;margin:0 0 10px}
.sub{color:var(--mut);margin:0 0 12px}
label.f{display:block;margin:10px 0}
label.f span{display:block;font-size:13px;color:var(--mut);margin-bottom:4px}
input,select{font:inherit;padding:9px 10px;border:1px solid #c8c8cc;border-radius:8px;background:#fff;color:var(--ink);width:100%}
input:focus,select:focus{outline:2px solid var(--gold);outline-offset:0;border-color:var(--gold)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--dark);color:#fff;border:0;border-radius:9px;padding:10px 16px;font:inherit;font-weight:600;cursor:pointer}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:7px}.btn.ghost{background:#e6e6ea;color:var(--ink)}
.btn.gold{background:var(--gold);color:#1d1d1f}.btn.lite{background:#ececef;color:var(--ink)}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.row>*{flex:1;min-width:140px}
.note{background:#fff8e1;border:1px solid #f2d27a;border-radius:9px;padding:10px 12px;margin:10px 0;font-size:14px}
.note.bad{background:#fdecea;border-color:#f1a9a0}
.note.good{background:#e8f5e9;border-color:#a5d6a7}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 12px}
.tabs button{flex:0 0 auto;background:#e6e6ea;border:0;border-radius:999px;padding:7px 14px;font:inherit;font-weight:600;cursor:pointer;color:var(--ink)}
.tabs button.on{background:var(--dark);color:#fff}
.tabs button:disabled{opacity:.4;cursor:default}
.gridwrap{overflow:auto;border:1px solid var(--line);border-radius:10px;background:#fff;max-height:70vh}
table.g{border-collapse:separate;border-spacing:0;width:100%;font-size:14px}
table.g th,table.g td{border-bottom:1px solid #ececef;border-right:1px solid #ececef;padding:0;text-align:center;white-space:nowrap}
table.g thead th{position:sticky;background:#f7f7f9;z-index:2;font-weight:600;padding:6px 4px}
table.g thead tr:nth-child(1) th{top:0}
table.g thead tr:nth-child(2) th{top:31px}
table.g thead tr:nth-child(3) th{top:62px}
table.g thead tr:nth-child(4) th{top:97px}
table.g .nm{position:sticky;left:0;background:#fff;z-index:1;text-align:left;padding:6px 10px;min-width:170px;max-width:220px;overflow:hidden;text-overflow:ellipsis}
table.g thead .nm{z-index:3;background:#f7f7f9}
table.g td.no{color:var(--mut);padding:6px;width:34px}
table.g input{border:0;border-radius:0;width:64px;text-align:center;padding:8px 2px;background:transparent}
table.g input:focus{outline:2px solid var(--gold);background:#fffbea}
table.g input.over{background:#fdecea;color:var(--bad);font-weight:700}
table.g input.pend{background:#fff5d6}
table.g select{border:0;padding:4px;width:76px;font-size:13px;background:transparent}
table.g th.grp{background:#1f1f1f;color:#fff}
table.g th.grp.t{background:#5a4a00;color:#fff}
table.g td.tot{font-weight:700;padding:6px 8px;background:#fafafa}
.stat{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0 0;color:var(--mut);font-size:13px}
.stat b{color:var(--ink)}
.list{width:100%;border-collapse:collapse;font-size:14px}
.list th,.list td{padding:8px;border-bottom:1px solid var(--line);text-align:left}
.bar{height:8px;border-radius:6px;background:#ececef;overflow:hidden;min-width:80px}
.bar i{display:block;height:100%;background:var(--gold)}
#toasts{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:50;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{background:#222;color:#fff;padding:9px 14px;border-radius:9px;font-size:14px;max-width:92vw;box-shadow:0 4px 18px #0003}
.toast.bad{background:var(--bad)}
.muted{color:var(--mut)}
.ic{width:18px;height:18px;flex:0 0 auto;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;vertical-align:-4px}
.btn .ic,.tabs .ic,.hbtn .ic{margin-right:2px}
.tabs button{display:inline-flex;align-items:center;gap:6px}
.hbtn{display:inline-flex;align-items:center;gap:6px}
#hLogo{height:40px;width:auto;max-width:60px;object-fit:contain;background:#fff;border-radius:8px;padding:2px;display:none}
.lgbig{display:block;margin:0 auto 8px;max-height:110px;max-width:160px;object-fit:contain}
.lgrow{display:flex;justify-content:center;gap:18px;margin-top:14px}
.lgrow img{height:46px;width:auto;max-width:70px;object-fit:contain}
.lgcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.lgcard{border:1px solid var(--line);border-radius:12px;padding:14px;text-align:center}
.lgcard .pv{height:120px;display:flex;align-items:center;justify-content:center;background:#f7f7f9;border-radius:10px;margin:8px 0 10px}
.lgcard .pv img{max-height:110px;max-width:90%;object-fit:contain}
.lgcard .pv span{color:var(--mut);font-size:13px}
.lgcard .row{justify-content:center}
.lgcard .row>*{flex:0 0 auto;min-width:0}
.ttl{display:flex;align-items:center;gap:8px}
.small{font-size:13px}
.plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px;max-height:46vh;overflow:auto;padding:2px}
.pp{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:6px 8px;background:#fff;cursor:pointer}
.pp input{width:auto}
.pph{width:36px;height:46px;border-radius:6px;overflow:hidden;flex:0 0 auto;border:1px solid #ccc;cursor:pointer;position:relative}
.pph img{width:100%;height:100%;object-fit:cover}
.pph:hover:after{content:"Photo";position:absolute;inset:auto 0 0 0;background:#000a;color:#fff;font-size:9px;text-align:center}
.ppt{min-width:0}.ppt b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ppt i{font-style:normal;font-size:12px;color:var(--mut)}
.cardpair{display:flex;gap:14px;flex-wrap:wrap}.cz{box-shadow:0 4px 16px #0002;border-radius:3mm}
.cwrap{width:100%;overflow:hidden}.cscale{transform-origin:0 0;transform:scale(.5);width:297mm;height:105mm}
@media (max-width:640px){.cscale{transform:scale(.3);height:63mm}}
#printArea{display:none}
@media print{
  body>*:not(#printArea){display:none!important}
  html,body{background:#fff!important}
  #printArea{display:block}
  #printArea .pg{page-break-after:always;break-after:page;overflow:hidden}
  #printArea .pg:last-child{page-break-after:auto;break-after:auto}
  #printArea .sheet{display:grid;grid-template-columns:85.6mm 85.6mm;grid-auto-rows:54mm;gap:2.5mm 4mm;justify-content:center}
}
@media (max-width:640px){main{padding:10px}table.g .nm{min-width:118px;max-width:150px}header .brand small{display:none}table.g input{width:54px}.card{padding:13px}}
</style>
</head>
<body>
<header>
  <img id="hLogo" alt="School logo">
  <div class="brand"><b id="hSchool">THPS Marks Online</b><small id="hSub">SARRS Marks Entry · works online and offline</small></div>
  <button class="pill off" id="pill" title="Click to upload now"><i></i><span id="pillT">Starting…</span></button>
  <a class="hbtn" href="./" style="text-decoration:none">&#8962; School Manager</a>
  <button class="hbtn" id="hUser" style="display:none"></button>
</header>
<main id="main"><div class="card">Loading…</div></main>
<div id="toasts"></div>
<div id="printArea"></div>
<style id="printCss"></style>
<script src="config.js"></script>
<script>
'use strict';
/* The offline copy (downloaded from the web app) gets its link written here. */
var API_URL_INJECT = (window.THPS_API || '');

var SLOTS=['T1W1','T1W2','T1W3','T1W4','T1T1','T1T2','T1T3','T1T4','T2W5','T2W6','T2W7','T2W8','T2T5','T2T6','T2T7','T2T8',
           'T3W1','T3W2','T3W3','T3W4','T3T1','T3T2','T3T3','T3T4','T4W5','T4W6','T4W7','T4W8','T4T5','T4T6','T4T7','T4T8'];
var TYPES=['','A/T','Quiz','Proj.','Pres.','Res.','U/Test','S/Test','E/Exam'];
var IN_GAS = !!(window.google && google.script && google.script.run);
/* Windows 11 (Fluent) style line icons */
var ICONS={
 marks:'<path d="M4 20h4l10.5-10.5a2.1 2.1 0 0 0-3-3L5 17v3z"/><path d="M13.5 7.5l3 3"/>',
 chart:'<path d="M4 20V4"/><path d="M4 20h16"/><rect x="7" y="11" width="3" height="6" rx="1"/><rect x="12" y="7" width="3" height="10" rx="1"/><rect x="17" y="13" width="3" height="4" rx="1"/>',
 help:'<path d="M2.5 8.5a14 14 0 0 1 19 0"/><path d="M5.5 11.8a9.5 9.5 0 0 1 13 0"/><path d="M8.7 15a5 5 0 0 1 6.6 0"/><circle cx="12" cy="18.5" r="1.1"/>',
 setup:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>',
 signin:'<path d="M10 17l5-5-5-5"/><path d="M15 12H3"/><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>',
 signout:'<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/>',
 upload:'<path d="M7 18a4.5 4.5 0 0 1-.6-9A6 6 0 0 1 18 8.5a4 4 0 0 1-.5 9.5"/><path d="M12 12v8"/><path d="M9 15l3-3 3 3"/>',
 download:'<path d="M12 4v11"/><path d="M7.5 10.5L12 15l4.5-4.5"/><path d="M5 19h14"/>',
 image:'<rect x="3" y="4" width="18" height="16" rx="2.5"/><circle cx="9" cy="9.5" r="1.8"/><path d="M21 16l-5-5-9 9"/>',
 trash:'<path d="M4 7h16"/><path d="M9 7V4.5h6V7"/><path d="M6.5 7l1 13h9l1-13"/>',
 people:'<circle cx="9" cy="8" r="3.2"/><path d="M3 20a6 6 0 0 1 12 0"/><circle cx="17" cy="9" r="2.4"/><path d="M15.5 14.2A4.8 4.8 0 0 1 21 19"/>',
 book:'<path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5z"/><path d="M4 20.5A2.5 2.5 0 0 0 6.5 23H20v-5"/>',
 user:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
 lock:'<rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/>',
 link:'<path d="M10 14a4.5 4.5 0 0 0 6.4 0l3-3a4.5 4.5 0 0 0-6.4-6.4l-1 1"/><path d="M14 10a4.5 4.5 0 0 0-6.4 0l-3 3a4.5 4.5 0 0 0 6.4 6.4l1-1"/>'
};
function ic(n){return '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">'+(ICONS[n]||'')+'</svg>'}
var LOGOS=null;
try{LOGOS=JSON.parse(localStorage.getItem('thpsm_logos')||'null')}catch(e){}
LOGOS=LOGOS||{logos:{},ms:0};
function setLogos(logos,ms){LOGOS={logos:logos||{},ms:ms||0};try{localStorage.setItem('thpsm_logos',JSON.stringify(LOGOS))}catch(e){}showLogos()}
function logo(k){return (LOGOS.logos||{})[k]||''}
function showLogos(){
  var h=$('#hLogo');if(logo('SCHOOL')&&AUTH){h.src=logo('SCHOOL');h.style.display='block'}else h.style.display='none';
  var b=$('#liLogo');if(b){if(logo('SCHOOL')){b.src=logo('SCHOOL');b.style.display=''}else b.style.display='none'}
  var r=$('#liLogos');if(r)r.innerHTML=['PROVINCE','NATIONAL'].filter(logo).map(function(k){return '<img src="'+logo(k)+'" alt="'+(k==='PROVINCE'?'Province':'National')+' logo">'}).join('');
}
var $ = function(s){return document.querySelector(s)};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}

/* ---------------- device storage ---------------- */
function ls(k,v){try{if(v===undefined){var x=localStorage.getItem(k);return x?JSON.parse(x):null}
  if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,JSON.stringify(v))}catch(e){if(v!==undefined)toast('This device could not save. Free some space in the browser.',1);return null}}
function apiUrl(){return API_URL_INJECT||ls('thpsm_api')||''}
var AUTH=ls('thpsm_auth'), DATA=null, Q=[], VIEW=ls('thpsm_view')||{}, SYNCING=false, ONLINE=null, LAST=0, PAGE='marks';
function uk(){return AUTH?String(AUTH.user).toLowerCase():''}
function loadLocal(){DATA=ls('thpsm_data_'+uk());Q=ls('thpsm_q_'+uk())||[]}
function saveData(){ls('thpsm_data_'+uk(),DATA)}
function saveQ(){ls('thpsm_q_'+uk(),Q)}

/* ---------------- talk to the Google Sheet ---------------- */
function call(fn){
  var args=[].slice.call(arguments,1);
  if(IN_GAS) return new Promise(function(res,rej){var r=google.script.run.withSuccessHandler(res).withFailureHandler(function(e){rej(e instanceof Error?e:new Error(String(e&&e.message||e)))});r[fn].apply(r,args)});
  var u=apiUrl(); if(!u) return Promise.reject(new Error('NOLINK'));
  return fetch(u,{method:'POST',redirect:'follow',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({fn:fn,args:args})})
    .then(function(r){return r.text()}).then(function(t){var j;try{j=JSON.parse(t)}catch(e){throw new Error('NET')}if(!j.ok)throw new Error(j.error);return j.data});
}
function isAuthErr(e){return /AUTH/.test(String(e&&e.message||e))}
function errText(e){var m=String(e&&e.message||e);return m.replace(/^Error:\s*/,'').replace(/^AUTH:\s*/,'')}

/* ---------------- status pill ---------------- */
function pill(){
  var p=$('#pill'),t=$('#pillT'),n=Q.length;
  if(!AUTH){p.className='pill off';t.textContent='Signed out';return}
  if(SYNCING){p.className='pill busy';t.textContent='Uploading…';return}
  if(ONLINE===false){p.className='pill off';t.textContent=n?('Offline · '+n+' saved on device'):'Offline · all saved';return}
  if(n){p.className='pill wait';t.textContent=n+' waiting to upload';return}
  p.className='pill ok';t.textContent='Online · all uploaded';
}
function toast(m,bad){var d=document.createElement('div');d.className='toast'+(bad?' bad':'');d.textContent=m;$('#toasts').appendChild(d);setTimeout(function(){d.remove()},bad?6000:3200)}

/* ---------------- sign in ---------------- */
function showLogin(msg){
  $('#hUser').style.display='none';AUTH=null;pill();$('#hLogo').style.display='none';
  var needLink=!IN_GAS&&!API_URL_INJECT;
  $('#main').innerHTML='<div class="card" style="max-width:420px;margin:5vh auto;text-align:left">'+
   '<img id="liLogo" class="lgbig" alt="School logo" style="display:none"><p id="liSchool" style="text-align:center;font-weight:700;margin:0 0 10px">'+esc((DATA&&DATA.school)||LOGOS.school||'TOM HOEY PRIMARY SCHOOL')+'</p>'+
   '<h1 class="ttl">'+ic('signin')+'Sign in</h1><p class="sub">Use the UserName and Password given to you by the Head Teacher (the same as in SARRS).</p>'+
   (msg?'<div class="note bad">'+esc(msg)+'</div>':'')+
   (needLink?'<label class="f"><span>Web app link (ends with /exec) – needed once</span><input id="liUrl" value="'+esc(apiUrl())+'" placeholder="https://script.google.com/macros/s/…/exec"></label>':'')+
   '<label class="f"><span>'+ic('user')+' UserName</span><input id="liU" autocomplete="username" autocapitalize="none" value="'+esc(showLogin.u||ls('thpsm_last')||'')+'"></label>'+
   '<label class="f"><span>'+ic('lock')+' Password</span><input id="liP" type="password" autocomplete="current-password"></label>'+
   '<button class="btn gold" id="liGo" style="width:100%;margin-top:8px">'+ic('signin')+'Sign in</button>'+
   '<p class="small muted" style="margin-top:12px">First sign-in needs the internet (school Wi-Fi). After that you can enter marks without signal; they upload by themselves when the laptop is back on Wi-Fi.</p><div class="lgrow" id="liLogos"></div></div>';
  showLogos();
  if(!LOGOS.ms&&(IN_GAS||apiUrl()))call('apiPublic').then(function(d){LOGOS.school=d.school;setLogos(d.logos,d.logoMs);LOGOS.school=d.school;try{localStorage.setItem('thpsm_logos',JSON.stringify(LOGOS))}catch(e){}var e=$('#liSchool');if(e&&d.school)e.textContent=d.school}).catch(function(){});
  var go=function(){doLogin()};
  $('#liGo').onclick=go;$('#liP').onkeydown=function(e){if(e.key==='Enter')go()};
  setTimeout(function(){($('#liU').value?$('#liP'):$('#liU')).focus()},50);
}
function doLogin(){
  var u=$('#liU').value.trim(),p=$('#liP').value;showLogin.u=u;
  if($('#liUrl')){var url=$('#liUrl').value.trim();if(!/^https:\/\/script\.google(usercontent)?\.com\/.+/.test(url)){showLogin('Paste the web app link from the Head Teacher. It starts with https://script.google.com/');return}ls('thpsm_api',url)}
  if(!u||!p){showLogin('Type your UserName and Password.');return}
  var a={user:u,pass:p};
  $('#liGo').disabled=true;$('#liGo').textContent='Signing in…';
  call('apiLogin',a).then(function(d){
    AUTH=a;ls('thpsm_auth',a);ls('thpsm_last',u);ls('thpsm_pw_'+u.toLowerCase(),hash(p));
    loadLocal();DATA=d;takeLogos();mergeQueue();saveData();ONLINE=true;LAST=Date.now();startApp();
    if(Q.length)sync();
  }).catch(function(e){
    if(isAuthErr(e)){showLogin(errText(e));return}
    // no network: allow sign-in with the copy kept on this device
    var saved=ls('thpsm_data_'+u.toLowerCase());
    if(saved&&ls('thpsm_pw_'+u.toLowerCase())===hash(p)){AUTH=a;ls('thpsm_auth',a);loadLocal();ONLINE=false;startApp();toast('No network – working offline with the copy on this device.')}
    else showLogin(String(e&&e.message)==='NOLINK'?'Paste the web app link first.':'Cannot reach the school database. Connect to the school Wi-Fi for the first sign-in.');
  });
}
function hash(s){var h=5381;s=String(s)+'|thps';for(var i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return String(h)}
function signOut(){
  if(Q.length&&!confirm(Q.length+' mark(s) are not uploaded yet. They stay safe on this device and upload next time you sign in. Sign out?'))return;
  ls('thpsm_auth',null);AUTH=null;DATA=null;Q=[];showLogin();
}

/* ---------------- data helpers ---------------- */
function mkey(sid,subj){return sid+'|'+subj}
function tkey(cc,subj){return cc+'|'+subj}
function markRow(sid,subj){var r=DATA.marks[mkey(sid,subj)];if(!r){r={v:new Array(32).fill(null),ms:0};DATA.marks[mkey(sid,subj)]=r}return r}
function taskRow(cc,subj){var r=DATA.tasks[tkey(cc,subj)];if(!r){r={max:new Array(32).fill(null),type:new Array(32).fill(''),ms:0};DATA.tasks[tkey(cc,subj)]=r}return r}
function applyChange(c){
  if(c.kind==='mark')markRow(c.sid,c.subj).v[c.slot-1]=c.value;
  else{var t=taskRow(c.cc,c.subj);if(c.kind==='max')t.max[c.slot-1]=c.value;else t.type[c.slot-1]=c.value||''}
}
function mergeQueue(){Q.forEach(applyChange)}   // unsent typing always shows on top of downloaded data
function pendingSet(){var s={};Q.forEach(function(c){s[c.kind+'|'+(c.kind==='mark'?c.sid:c.cc)+'|'+c.subj+'|'+c.slot]=1});return s}
function addChange(c){
  c.id=Date.now().toString(36)+Math.random().toString(36).slice(2,7);c.ts=Date.now();
  Q=Q.filter(function(o){return !(o.kind===c.kind&&o.cc===c.cc&&o.subj===c.subj&&o.slot===c.slot&&(o.sid||'')===(c.sid||''))});
  Q.push(c);applyChange(c);saveQ();saveData();pill();
  clearTimeout(addChange.t);addChange.t=setTimeout(sync,1500);
}

/* ---------------- upload / download ---------------- */
function sync(){
  if(SYNCING||!AUTH||!DATA)return Promise.resolve();
  SYNCING=true;pill();
  var batch=Q.slice(0,250);
  return call('apiSync',AUTH,batch,DATA.serverMs||0).then(function(r){
    ONLINE=true;LAST=Date.now();
    var gone={};r.acked.forEach(function(id){gone[id]=1});
    r.rejected.forEach(function(x){gone[x.id]=1;toast('Not saved: '+x.why,1)});
    Q=Q.filter(function(c){return !gone[c.id]});saveQ();
    Object.keys(r.marks).forEach(function(k){DATA.marks[k]=r.marks[k]});
    Object.keys(r.tasks).forEach(function(k){DATA.tasks[k]=r.tasks[k]});
    if(r.year&&r.year!==DATA.year){toast('The school year changed to '+r.year+'. Signing in again…');SYNCING=false;return relogin()}
    if(r.students){var chg=JSON.stringify(r.students.map(function(x){return x.id+x.sur+x.name+x.cc+x.status}))!==JSON.stringify(DATA.students.map(function(x){return x.id+x.sur+x.name+x.cc+x.status}));DATA.students=r.students;if(chg&&PAGE!=='stu')toast('Class list updated')}
    DATA.serverMs=r.serverMs;mergeQueue();saveData();
    if(r.logoMs&&r.logoMs!==LOGOS.ms)call('apiLogos',AUTH).then(function(x){var sc=LOGOS.school;setLogos(x.logos,x.logoMs);LOGOS.school=sc;try{localStorage.setItem('thpsm_logos',JSON.stringify(LOGOS))}catch(e){}if(PAGE==='setup')render()}).catch(function(){});
    SYNCING=false;pill();refreshGrid();
    if(Q.length&&batch.length===250)return sync();
  }).catch(function(e){
    SYNCING=false;
    if(isAuthErr(e)){toast(errText(e),1);ls('thpsm_auth',null);showLogin('Your sign-in was refused: '+errText(e));return}
    ONLINE=false;pill();
  });
}
function relogin(){return call('apiLogin',AUTH).then(function(d){DATA=d;takeLogos();mergeQueue();saveData();startApp()})}
function takeLogos(){if(DATA&&DATA.logos){setLogos(DATA.logos,DATA.logoMs);LOGOS.school=DATA.school;try{localStorage.setItem('thpsm_logos',JSON.stringify(LOGOS))}catch(e){}delete DATA.logos}}
setInterval(function(){if(AUTH&&DATA&&!document.hidden)sync()},Q.length?15000:30000);
setInterval(function(){if(AUTH&&DATA&&Q.length&&!SYNCING)sync()},15000);
window.addEventListener('online',function(){sync()});
window.addEventListener('offline',function(){ONLINE=false;pill()});
document.addEventListener('visibilitychange',function(){if(!document.hidden)sync()});
$('#pill').onclick=function(){if(AUTH)sync().then(function(){toast(Q.length?(Q.length+' still waiting – no network yet.'):'Everything is uploaded.')})};

      toast('Saved '+d.id);renderStudents(navHtml())}).catch(function(e){$('#fSave').disabled=false;$('#sMsg').textContent='';toast(isAuthErr(e)?errText(e):'Not saved: '+errText(e),1)});

function students(cc){return DATA.students.filter(function(s){return s.cc===cc}).sort(function(a,b){return (a.sur+a.name).localeCompare(b.sur+b.name)})}
function gradeOf(cc){if(/^prep/i.test(cc))return 'Prep';var m=String(cc).match(/^(\d)/);return m?'Grade '+m[1]:''}
function renderMarks(nav){
  var cls=DATA.me.classes;
  if(!cls.length){$('#main').innerHTML=nav+'<div class="card"><div class="note">No class is linked to your UserName yet. Ask the Head Teacher to put your class on the Teachers list.</div></div>';bindPages();return}
  var cc=cls.indexOf(VIEW.cc)>=0?VIEW.cc:cls[0];
  var grade=gradeOf(cc),subs=(DATA.subjects[grade]||[]),subj=Number(VIEW.subj)||1;
  if(subj>8)subj=1;
  var term=Number(VIEW.term)||1;
  VIEW={cc:cc,subj:subj,term:term};ls('thpsm_view',VIEW);
  var h=nav+'<div class="card"><div class="row">'+
    '<label class="f"><span>'+ic('people')+' Class</span><select id="sCc">'+cls.map(function(c){return '<option'+(c===cc?' selected':'')+'>'+esc(c)+'</option>'}).join('')+'</select></label>'+
    '<label class="f"><span>'+ic('book')+' Subject</span><select id="sSu">'+[1,2,3,4,5,6,7,8].map(function(n){return '<option value="'+n+'"'+(n===subj?' selected':'')+'>'+n+'. '+esc(subs[n-1]||('Subject '+n))+'</option>'}).join('')+'</select></label></div>'+
    '<div class="tabs" id="tTabs">'+[1,2,3,4].map(function(t){var skill=(grade==='Grade 1'&&t<=2);return '<button data-t="'+t+'" class="'+(t===term?'on':'')+'"'+(skill?' title="Skills Report term"':'')+'>Term '+t+(t<=2?' (AP1)':' (AP2)')+'</button>'}).join('')+'</div>';
  if(grade==='Prep'||(grade==='Grade 1'&&term<=2)){
    h+='<div class="note">'+(grade==='Prep'?'Prep':'Grade 1 Terms 1 & 2 (AP1)')+' is assessed with the <b>Skills Report</b>, not marks. Use the Skills Report in SARRS (Excel).</div></div>';
    $('#main').innerHTML=h;bindMarks();return;
  }
  h+='<div class="gridwrap"><table class="g" id="grid">'+gridHead(cc,subj,term)+'<tbody>'+gridBody(cc,subj,term)+'</tbody></table></div>'+
     '<div class="stat" id="gstat"></div>'+
     '<p class="small muted">Type the mark and press Enter to go down. Set the <b>Max</b> and <b>Type</b> for each task in the grey rows first. A red cell is above the Max.</p></div>';
  $('#main').innerHTML=h;bindMarks();bindGrid(cc,subj,term);gstat(cc,subj,term);
}
function slotsOf(term){var s=(term-1)*8;return [0,1,2,3,4,5,6,7].map(function(i){return s+i+1})}
function slotLabel(n){var s=SLOTS[n-1];return (s.charAt(2)==='W'?'W':'Task ')+s.slice(3)}
function gridHead(cc,subj,term){
  var t=taskRow(cc,subj),sl=slotsOf(term),pend=pendingSet();
  var r1='<tr><th class="nm" rowspan="4">Student</th><th rowspan="4">No</th><th class="grp" colspan="4">Weekly assessments</th><th class="grp t" colspan="4">Tasks / tests</th><th rowspan="4">Weekly<br>total</th><th rowspan="4">Task<br>total</th></tr>';
  var r2='<tr>'+sl.map(function(n){return '<th>'+slotLabel(n)+'</th>'}).join('')+'</tr>';
  var r3='<tr>'+sl.map(function(n){var v=t.type[n-1]||'';return '<th><select data-k="type" data-s="'+n+'" title="Task type">'+TYPES.map(function(o){return '<option'+(o===v?' selected':'')+' value="'+esc(o)+'">'+(o||'Type')+'</option>'}).join('')+(TYPES.indexOf(v)<0?'<option selected>'+esc(v)+'</option>':'')+'</select></th>'}).join('')+'</tr>';
  var r4='<tr>'+sl.map(function(n){var v=t.max[n-1];return '<th><input data-k="max" data-s="'+n+'" inputmode="decimal" placeholder="Max" value="'+(v==null?'':esc(v))+'" class="'+(pend['max|'+cc+'|'+subj+'|'+n]?'pend':'')+'" title="Highest mark for this task"></th>'}).join('')+'</tr>';
  return '<thead>'+r1+r2+r3+r4+'</thead>';
}
function gridBody(cc,subj,term){
  var t=taskRow(cc,subj),sl=slotsOf(term),list=students(cc),pend=pendingSet();
  if(!list.length)return '<tr><td colspan="12" style="padding:16px">No students in '+esc(cc)+' for '+DATA.year+'. The Head Teacher uploads the class lists from Excel.</td></tr>';
  return list.map(function(s,i){
    var m=(DATA.marks[mkey(s.id,subj)]||{v:[]}).v;
    var cells=sl.map(function(n){var v=m[n-1],mx=t.max[n-1];var cl=[];if(v!=null&&mx!=null&&mx!==''&&Number(v)>Number(mx))cl.push('over');if(pend['mark|'+s.id+'|'+subj+'|'+n])cl.push('pend');
      return '<td><input data-k="mark" data-s="'+n+'" data-id="'+esc(s.id)+'" data-r="'+i+'" inputmode="decimal" value="'+(v==null?'':esc(v))+'" class="'+cl.join(' ')+'"></td>'}).join('');
    return '<tr data-id="'+esc(s.id)+'"><td class="nm" title="'+esc(s.id)+'">'+esc(s.sur)+' '+esc(s.name)+'</td><td class="no">'+(i+1)+'</td>'+cells+'<td class="tot" data-tw="'+esc(s.id)+'"></td><td class="tot" data-tt="'+esc(s.id)+'"></td></tr>';
  }).join('');
}
function bindMarks(){
  bindPages();
  var c=$('#sCc'),s=$('#sSu');
  if(c)c.onchange=function(){VIEW.cc=c.value;render()};
  if(s)s.onchange=function(){VIEW.subj=Number(s.value);render()};
  [].forEach.call(document.querySelectorAll('#tTabs button'),function(b){b.onclick=function(){VIEW.term=Number(b.dataset.t);render()}});
}
function navHtml(){var d=document.createElement('div');d.appendChild($('#pages').cloneNode(true));return d.innerHTML}
function num(v){v=String(v).trim().replace(',','.');if(v==='')return null;if(!/^\d+(\.\d+)?$/.test(v))return NaN;return Number(v)}
function bindGrid(cc,subj,term){
  var g=$('#grid');
  g.addEventListener('change',function(e){
    var el=e.target,k=el.dataset.k,n=Number(el.dataset.s);if(!k)return;
    var t=taskRow(cc,subj);
    if(k==='type'){addChange({kind:'type',cc:cc,subj:subj,slot:n,value:el.value});return}
    var v=num(el.value);
    if(isNaN(v)){toast('Type a number (or leave it empty).',1);el.value=el.dataset.old||'';return}
    if(k==='max'){
      if(v!==null&&v<=0){toast('Max must be above 0.',1);el.value=el.dataset.old||'';return}
      addChange({kind:'max',cc:cc,subj:subj,slot:n,value:v});el.classList.add('pend');markOver(cc,subj,term);gstat(cc,subj,term);return}
    var mx=t.max[n-1];
    if(v!==null&&(mx==null||mx==='')){toast('Set the Max for '+slotLabel(n)+' first (grey row at the top).',1);el.value=el.dataset.old||'';return}
    if(v!==null&&v>Number(mx)){toast('The Max for '+slotLabel(n)+' is '+mx+'. This mark is too high.',1);el.value=el.dataset.old||'';return}
    addChange({kind:'mark',cc:cc,subj:subj,slot:n,sid:el.dataset.id,value:v});
    el.classList.add('pend');el.classList.remove('over');rowTotals(cc,subj,term,el.dataset.id);gstat(cc,subj,term);
  });
  g.addEventListener('focusin',function(e){if(e.target.tagName==='INPUT')e.target.dataset.old=e.target.value});
  g.addEventListener('keydown',function(e){
    var el=e.target;if(el.tagName!=='INPUT'||el.dataset.k!=='mark')return;
    var r=Number(el.dataset.r),n=el.dataset.s,next=null;
    if(e.key==='Enter'||e.key==='ArrowDown')next=g.querySelector('input[data-k="mark"][data-s="'+n+'"][data-r="'+(r+1)+'"]');
    else if(e.key==='ArrowUp')next=g.querySelector('input[data-k="mark"][data-s="'+n+'"][data-r="'+(r-1)+'"]');
    if(next){e.preventDefault();el.blur();next.focus();next.select()}
    else if(e.key==='Enter'){e.preventDefault();el.blur()}
  });
  students(cc).forEach(function(s){rowTotals(cc,subj,term,s.id)});
}
function rowTotals(cc,subj,term,sid){
  var m=(DATA.marks[mkey(sid,subj)]||{v:[]}).v,sl=slotsOf(term),w=0,t=0,hw=false,ht=false;
  sl.forEach(function(n,i){var v=m[n-1];if(v==null||v==='')return;if(i<4){w+=Number(v);hw=true}else{t+=Number(v);ht=true}});
  var a=document.querySelector('[data-tw="'+cssq(sid)+'"]'),b=document.querySelector('[data-tt="'+cssq(sid)+'"]');
  if(a)a.textContent=hw?round(w):'';if(b)b.textContent=ht?round(t):'';
}
function cssq(s){return String(s).replace(/["\\]/g,'\\$&')}
function round(x){return Math.round(x*100)/100}
function markOver(cc,subj,term){
  var t=taskRow(cc,subj);
  [].forEach.call(document.querySelectorAll('#grid input[data-k="mark"]'),function(el){var n=Number(el.dataset.s),v=num(el.value),mx=t.max[n-1];el.classList.toggle('over',v!=null&&mx!=null&&mx!==''&&v>Number(mx))});
}
function gstat(cc,subj,term){
  var el=$('#gstat');if(!el)return;
  var list=students(cc),sl=slotsOf(term),t=taskRow(cc,subj),filled=0,need=0;
  sl.forEach(function(n){if(t.max[n-1]!=null&&t.max[n-1]!=='')need+=list.length});
  list.forEach(function(s){var m=(DATA.marks[mkey(s.id,subj)]||{v:[]}).v;sl.forEach(function(n){if(m[n-1]!=null&&m[n-1]!==''&&t.max[n-1]!=null&&t.max[n-1]!=='')filled++})});
  el.innerHTML='<span><b>'+list.length+'</b> students</span><span><b>'+filled+'</b> of '+need+' marks entered this term</span><span>Last upload: <b>'+(LAST?new Date(LAST).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}):'not yet')+'</b></span>';
}
/* refresh values after a download without losing the cell being typed in */
function refreshGrid(){
  if(PAGE!=='marks'||!$('#grid'))return;
  var cc=VIEW.cc,subj=VIEW.subj,term=VIEW.term,t=taskRow(cc,subj),pend=pendingSet(),act=document.activeElement;
  [].forEach.call(document.querySelectorAll('#grid input'),function(el){
    if(el===act)return;var n=Number(el.dataset.s),v;
    if(el.dataset.k==='max'){v=t.max[n-1];el.classList.toggle('pend',!!pend['max|'+cc+'|'+subj+'|'+n])}
    else{v=(DATA.marks[mkey(el.dataset.id,subj)]||{v:[]}).v[n-1];el.classList.toggle('pend',!!pend['mark|'+el.dataset.id+'|'+subj+'|'+n])}
    el.value=v==null?'':v;
  });
  [].forEach.call(document.querySelectorAll('#grid select'),function(el){if(el!==act){var v=t.type[Number(el.dataset.s)-1]||'';if(TYPES.indexOf(v)>=0)el.value=v}});
  markOver(cc,subj,term);students(cc).forEach(function(s){rowTotals(cc,subj,term,s.id)});gstat(cc,subj,term);
}

/* ---------------- Administrator: class progress ---------------- */
function renderSummary(nav){
  $('#main').innerHTML=nav+'<div class="card"><h2 class="ttl">'+ic('chart')+'Class progress '+DATA.year+'</h2><p class="sub">Marks entered by each class (all subjects, all terms). Updates when you open this page.</p><div id="sumT">Loading…</div></div>';
  bindPages();
  call('apiSummary',AUTH).then(function(rows){
    ONLINE=true;pill();
    $('#sumT').innerHTML='<div style="overflow:auto"><table class="list"><thead><tr><th>Class</th><th>Teacher</th><th>Students</th><th>Marks entered</th><th></th><th>Last entry</th></tr></thead><tbody>'+
      rows.map(function(r){var full=r.students*8*24,pc=full?Math.min(100,Math.round(r.filled/full*100)):0;

var LOGO_INFO={SCHOOL:['School logo','Every page, ID cards, certificates'],PROVINCE:['Province logo','ID cards, certificates, sign-in box'],CHURCH:['Church logo','Attainment certificates'],NATIONAL:['National education logo','Inspection forms (later)']};
function renderSetup(nav){
  $('#main').innerHTML=nav+'<div class="card"><h2 class="ttl">'+ic('image')+'Logos</h2><p class="sub">Change a logo here and every teacher\'s screen shows the new one the next time it connects. Pictures are made small automatically (PNG or JPG, any size).</p><div class="lgcards">'+
    Object.keys(LOGO_INFO).map(function(k){var src=logo(k);return '<div class="lgcard"><b>'+LOGO_INFO[k][0]+'</b><div class="small muted">'+LOGO_INFO[k][1]+'</div><div class="pv">'+(src?'<img src="'+src+'" alt="">':'<span>No logo yet</span>')+'</div>'+
      '<div class="row"><label class="btn gold" style="cursor:pointer">'+ic('upload')+(src?'Change':'Add')+'<input type="file" accept="image/*" data-lg="'+k+'" style="display:none"></label>'+(src?'<button class="btn lite" data-rm="'+k+'">'+ic('trash')+'Remove</button>':'')+'</div></div>'}).join('')+
    '</div><p class="small muted" style="margin-top:12px">Needs the internet. The Excel workbook keeps its own logos: change those with the School Logo / Province Logo buttons on the SARRS SETUP and SFMS Setup pages.</p></div>'+
    '<div class="card"><h2 class="ttl">'+ic('setup')+'School details (ID cards, certificates, report cards)</h2><div id="setF">Loading…</div></div>'+
    '<div class="card"><h2 class="ttl">'+ic('link')+'Teachers\' link</h2><p class="small">Send teachers this link with their SARRS UserName and Password:</p><input readonly value="'+esc(DATA.appUrl||apiUrl())+'" onclick="this.select()"></div>';
  bindPages();
  call('apiSettings',AUTH).then(function(v){
    var F=[['School','School name'],['District','Place line'],['Address','Address (back of ID cards)'],['Phone','Phone'],['Email','Email'],['HeadTeacher','Head Teacher (name on cards and certificates)'],['BoardChair','Chairman, Board of Management (Grade 6 certificate)'],['CardValidUntil','ID cards valid until (dd/mm/yyyy)']];
    $('#setF').innerHTML='<div class="row">'+F.map(function(f){return '<label class="f" style="min-width:240px"><span>'+f[1]+'</span><input data-set="'+f[0]+'" value="'+esc(v[f[0]])+'"></label>'}).join('')+'</div>'+
      '<div class="row"><label class="f"><span>Show AP1 report online (QR on student cards)</span><select data-set="ShowAP1"><option'+(/^y/i.test(v.ShowAP1)?' selected':'')+'>Yes</option><option'+(/^y/i.test(v.ShowAP1)?'':' selected')+'>No</option></select></label>'+
      '<label class="f"><span>Show AP2 report online</span><select data-set="ShowAP2"><option'+(/^y/i.test(v.ShowAP2)?' selected':'')+'>Yes</option><option'+(/^y/i.test(v.ShowAP2)?'':' selected')+'>No</option></select></label></div>'+
      '<button class="btn gold" id="setSave">'+ic('upload')+'Save details</button>';
    $('#setSave').onclick=function(){var o={};[].forEach.call(document.querySelectorAll('[data-set]'),function(e){o[e.dataset.set]=e.value});
      call('apiSaveSettings',AUTH,o).then(function(){CARDS=null;toast('Details saved.')}).catch(function(e){toast(isAuthErr(e)?errText(e):'No network – connect to save.',1)})};
  }).catch(function(e){$('#setF').innerHTML='<div class="note bad">Needs the internet.</div>'});
  [].forEach.call(document.querySelectorAll('input[data-lg]'),function(inp){inp.onchange=function(){if(inp.files[0])pickLogo(inp.dataset.lg,inp.files[0])}});
  [].forEach.call(document.querySelectorAll('button[data-rm]'),function(b){b.onclick=function(){if(confirm('Remove the '+LOGO_INFO[b.dataset.rm][0].toLowerCase()+'?'))saveLogo(b.dataset.rm,'')}});
}
function pickLogo(k,file){
  if(!/^image\//.test(file.type)){toast('Choose a picture file (PNG or JPG).',1);return}
  var fr=new FileReader();
  fr.onload=function(){var img=new Image();img.onload=function(){
    var m=256,w=img.width,h=img.height,sc=Math.min(1,m/Math.max(w,h)),c=document.createElement('canvas');
    c.width=Math.max(1,Math.round(w*sc));c.height=Math.max(1,Math.round(h*sc));c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    var d=c.toDataURL('image/webp',0.86);if(d.indexOf('data:image/webp')!==0)d=c.toDataURL('image/png');
    saveLogo(k,d)};img.onerror=function(){toast('That picture could not be opened.',1)};img.src=fr.result};
  fr.readAsDataURL(file);
}
function saveLogo(k,d){
  toast('Saving the logo…');
  call('apiSetLogo',AUTH,k,d).then(function(x){var sc=LOGOS.school;setLogos(x.logos,x.logoMs);LOGOS.school=sc;try{localStorage.setItem('thpsm_logos',JSON.stringify(LOGOS))}catch(e){}ONLINE=true;pill();toast(d?'Logo saved. Teachers see it next time they connect.':'Logo removed.');render()})
  .catch(function(e){if(isAuthErr(e))toast(errText(e),1);else{ONLINE=false;pill();toast('No network – connect to the internet to change logos.',1)}});
}

/* ---------------- help ---------------- */
function renderHelp(nav){
  var link=DATA.appUrl||apiUrl();
  $('#main').innerHTML=nav+'<div class="card"><h2 class="ttl">'+ic('help')+'Working without network</h2>'+
   (IN_GAS?'<div class="note">You are using the <b>online link</b>. If the network drops, keep this tab <b>open</b>: marks you type are kept on this device and upload by themselves when the Wi-Fi comes back. If you close the tab without network, you can only open it again once you are online.</div>'+
     (link?'<p>For classrooms with no signal, use the <b>offline copy</b> instead. It opens even with no network at all:</p><p><a class="btn gold" href="'+esc(link)+'?file=offline" target="_blank" rel="noopener">'+ic('download')+'Download the offline copy</a></p><ol class="small"><li>Download it while on the school Wi-Fi. A file <b>THPS_Marks_Offline.html</b> is saved (usually in Downloads).</li><li>Open that file in Chrome or Edge and sign in once while on Wi-Fi.</li><li>After that, open the same file in class any time, with or without network.</li></ol>':'')

   '<h2 style="margin-top:16px">Good to know</h2><ul class="small">'+

/* ---------- screen ---------- */
function loadCards(force){
  if(CARDS&&!force)return Promise.resolve(CARDS);
  return call('apiCards',AUTH).then(function(d){CARDS=d;return d});
}
function loadPhotos(keys){
  var need=keys.filter(function(k){return CARDS.photoKeys.indexOf(k)>=0&&!PHOTOS[k]});
  if(!need.length)return Promise.resolve();
  var chunks=[];for(var i=0;i<need.length;i+=40)chunks.push(need.slice(i,i+40));
  return chunks.reduce(function(p,c){return p.then(function(){return call('apiPhotos',AUTH,c).then(function(m){Object.keys(m).forEach(function(k){PHOTOS[k]=m[k]})})})},Promise.resolve());
}
function people(){
  if(CVIEW.tab==='tid')return CARDS.teachers.map(function(t){return {kind:'T',id:t.id,k:t.k,pkey:'T:'+t.id,title:t.name,sub:t.position+(t.cls&&t.cls!=='All'?' · '+t.cls:''),cls:t.cls,row:t}});
  var cc=CVIEW.cc;
  return CARDS.students.filter(function(s){return !cc||s.cc===cc}).sort(function(a,b){return (a.cc+a.sur+a.name).localeCompare(b.cc+b.sur+b.name)})
    .map(function(s){return {kind:'S',id:s.id,k:s.k,pkey:'S:'+s.id.toUpperCase(),title:s.sur+' '+s.name,sub:s.grade+' · Class '+s.cc,cc:s.cc,sex:s.sex,dob:s.dob,row:s}});
}
function renderCards(nav){
  $('#main').innerHTML=nav+'<div class="card">Loading…</div>';bindPages();
  loadCards().then(function(){drawCards(nav)}).catch(function(e){$('#main').innerHTML=nav+'<div class="card"><div class="note bad">Needs the internet: '+esc(errText(e))+'</div></div>';bindPages()});
}
function drawCards(nav){
  var tabs=[['tid','user','Teacher ID cards'],['sid','people','Student ID cards'],['cprep','image','Prep certificates'],['cg6','image','Grade 6 certificates']];
  var cls=[];CARDS.students.forEach(function(s){if(cls.indexOf(s.cc)<0)cls.push(s.cc)});
  cls.sort(function(a,b){return (/^prep/i.test(a)?0:+a[0])-(/^prep/i.test(b)?0:+b[0])||(a<b?-1:1)});
  var isCert=CVIEW.tab==='cprep'||CVIEW.tab==='cg6';
  if(CVIEW.tab==='sid'&&CVIEW.cc&&cls.indexOf(CVIEW.cc)<0)CVIEW.cc='';
  var list=isCert?CARDS.students.filter(function(s){return CVIEW.tab==='cprep'?s.grade==='Prep':s.grade==='Grade 6'}).map(function(s){return {kind:'S',id:s.id,pkey:'S:'+s.id.toUpperCase(),title:s.sur+' '+s.name,sub:'Class '+s.cc+' · '+(s.result||'no result yet')+(s.yearPct!==''?' · '+Math.round(s.yearPct)+'%':''),row:s,pre:s.result==='PROMOTE'}}):people();
  if(!CVIEW.selFor||CVIEW.selFor!==CVIEW.tab+CVIEW.cc){CVIEW.sel={};list.forEach(function(p){CVIEW.sel[p.id]=isCert?!!p.pre:true});CVIEW.selFor=CVIEW.tab+CVIEW.cc}
  var h=nav+'<div class="card"><div class="tabs" id="ctabs">'+tabs.map(function(t){return '<button data-c="'+t[0]+'" class="'+(CVIEW.tab===t[0]?'on':'')+'">'+ic(t[1])+t[2]+'</button>'}).join('')+'</div>';

  if(!isCert)h+='<label class="f"><span>Print on</span><select id="cMode"><option value="cr80"'+(CVIEW.mode==='cr80'?' selected':'')+'>ID card printer (CR80 cards, front + back)</option><option value="a4"'+(CVIEW.mode==='a4'?' selected':'')+'>A4 paper – 10 cards per page, cut out</option></select></label>';
  else h+='<label class="f"><span>Date on certificate</span><input id="cDate" value="'+esc(CVIEW.date||todayTxt())+'"></label>';
  h+='<div style="flex:0 0 auto;min-width:0"><button class="btn gold" id="cPrint">'+ic('download')+'Print selected</button></div></div>';
  if(isCert)h+='<p class="small muted">Ticked = students marked <b>PROMOTE</b> in the results uploaded from Excel. You can tick or untick anyone. Head Teacher'+(CVIEW.tab==='cg6'?' and Board Chairman':'')+' names come from Setup.</p>';
  else h+='<p class="small muted">Card details, logos and the “valid until” date come from <b>Setup</b>. Click a photo to add or change it (a phone photo is fine; it is cropped to passport shape).</p>';
  h+='<div class="row" style="margin:6px 0"><button class="btn lite" id="cAll" style="flex:0 0 auto">Tick all</button><button class="btn lite" id="cNone" style="flex:0 0 auto">Untick all</button><span class="small muted" id="cCount" style="align-self:center"></span></div>';
  h+='<div class="plist">'+list.map(function(p){return '<label class="pp"><input type="checkbox" data-id="'+esc(p.id)+'"'+(CVIEW.sel[p.id]?' checked':'')+'><span class="pph" data-pk="'+esc(p.pkey)+'" title="Add or change photo"><img src="'+(ph(p.pkey)||SILHOUETTE)+'"></span><span class="ppt"><b>'+esc(p.title)+'</b><i>'+esc(p.id)+' · '+esc(p.sub)+'</i></span></label>'}).join('')+(list.length?'':'<p class="muted">Nobody here yet. Upload the class lists and results from Excel first.</p>')+'</div>';
  if(list.length){var first=list[0];h+='<h2 style="margin-top:16px">Preview</h2><div class="prev" id="cPrev"></div>'}
  h+='</div>';
  $('#main').innerHTML=h;bindPages();
  [].forEach.call(document.querySelectorAll('#ctabs button'),function(b){b.onclick=function(){CVIEW.tab=b.dataset.c;drawCards(nav)}});
  var c=$('#cCls');if(c)c.onchange=function(){CVIEW.cc=c.value;drawCards(nav)};
  var m=$('#cMode');if(m)m.onchange=function(){CVIEW.mode=m.value};
  var dt=$('#cDate');if(dt)dt.onchange=function(){CVIEW.date=dt.value;preview(list)};
  function count(){$('#cCount').textContent=list.filter(function(p){return CVIEW.sel[p.id]}).length+' of '+list.length+' selected'}
  [].forEach.call(document.querySelectorAll('.plist input[type=checkbox]'),function(x){x.onchange=function(){CVIEW.sel[x.dataset.id]=x.checked;count()}});
  $('#cAll').onclick=function(){list.forEach(function(p){CVIEW.sel[p.id]=true});drawCards(nav)};
  $('#cNone').onclick=function(){list.forEach(function(p){CVIEW.sel[p.id]=false});drawCards(nav)};
  [].forEach.call(document.querySelectorAll('.pph'),function(sp){sp.onclick=function(e){e.preventDefault();pickPhoto(sp.dataset.pk,function(){drawCards(nav)})}});
  $('#cPrint').onclick=function(){var chosen=list.filter(function(p){return CVIEW.sel[p.id]});if(!chosen.length){toast('Tick at least one person.',1);return}
    toast('Preparing '+chosen.length+'…');loadPhotos(chosen.map(function(p){return p.pkey})).then(function(){printOut(chosen)}).catch(function(){printOut(chosen)})};
  count();
  loadPhotos(list.map(function(p){return p.pkey})).then(function(){
    [].forEach.call(document.querySelectorAll('.pph'),function(sp){if(ph(sp.dataset.pk))sp.querySelector('img').src=ph(sp.dataset.pk)});preview(list)}).catch(function(){preview(list)});
  preview(list);

function preview(list){
  var el=$('#cPrev');if(!el||!list.length)return;var p=list.filter(function(x){return CVIEW.sel[x.id]})[0]||list[0];
  if(CVIEW.tab==='cprep'||CVIEW.tab==='cg6'){el.innerHTML='<div class="cwrap"><div class="cscale">'+(CVIEW.tab==='cprep'?certPrep(p.row):certG6(p.row))+'</div></div>';return}
  el.innerHTML='<div class="cardpair"><div class="cz">'+cardFront(p)+'</div><div class="cz">'+cardBack(p)+'</div></div>';
}
function pickPhoto(key,done){
  var inp=document.createElement('input');inp.type='file';inp.accept='image/*';
  inp.onchange=function(){var f=inp.files[0];if(!f)return;var fr=new FileReader();fr.onload=function(){var img=new Image();img.onload=function(){
    var W=300,H=400,c=document.createElement('canvas');c.width=W;c.height=H;var g=c.getContext('2d');
    var r=Math.max(W/img.width,H/img.height),w=img.width*r,h=img.height*r;g.fillStyle='#fff';g.fillRect(0,0,W,H);g.drawImage(img,(W-w)/2,(H-h)/2.6,w,h);
    var d=c.toDataURL('image/jpeg',0.82);toast('Saving photo…');
    call('apiSetPhoto',AUTH,key,d).then(function(){PHOTOS[key]=d;if(CARDS.photoKeys.indexOf(key)<0)CARDS.photoKeys.push(key);toast('Photo saved.');done()}).catch(function(e){toast(isAuthErr(e)?errText(e):'No network – connect to save photos.',1)})};img.src=fr.result};fr.readAsDataURL(f)};
  inp.click();

function printOut(list){

  }else if(CVIEW.mode==='cr80'){
    css.textContent='@page{size:85.6mm 54mm;margin:0}#printArea .idc{border-radius:0}';

  }else{
    css.textContent='@page{size:A4 portrait;margin:8mm 11mm}#printArea .idc{outline:.15mm dashed #999}';
    for(var i=0;i<list.length;i+=10){
      var part=list.slice(i,i+10),fr='',bk='';
      part.forEach(function(p){fr+=cardFront(p)});
      // backs: swap the two columns so they line up when printed on both sides (flip on long edge)
      for(var r=0;r<part.length;r+=2){var a=part[r],b=part[r+1];bk+=(b?cardBack(b):'<div class="idc" style="visibility:hidden"></div>')+cardBack(a)}
      html+='<div class="pg sheet">'+fr+'</div><div class="pg sheet">'+bk+'</div>';
    }
  }
  box.innerHTML=html;
  setTimeout(function(){window.print()},400);
}

(function(){var st=document.createElement('style');st.textContent=CARD_CSS+CERT_CSS;document.head.appendChild(st)})();

/* ---------------- start ---------------- */
(function start(){
  pill();
  if(!AUTH){showLogin();return}
  loadLocal();
  if(DATA){ONLINE=null;startApp();sync().then(function(){if(ONLINE)return relogin()})}
  else{$('#main').innerHTML='<div class="card">Loading your classes…</div>';
    call('apiLogin',AUTH).then(function(d){DATA=d;takeLogos();mergeQueue();saveData();ONLINE=true;LAST=Date.now();startApp()})
    .catch(function(e){showLogin(isAuthErr(e)?errText(e):'Cannot reach the school database. Connect to the school Wi-Fi and sign in.')})}
})();
</script>
